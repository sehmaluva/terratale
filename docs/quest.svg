<text x="297.64" y="100.69" font-size="11" fill="#8d7a5f" font-family="Noto Serif, Liberation Serif, Georgia, serif" font-weight="bold" text-anchor="middle">A QUEST</text>
<text x="297.64" y="130.69" font-size="19" fill="#3b2f23" font-family="Noto Serif, Liberation Serif, Georgia, serif" font-weight="bold" text-anchor="middle">Chart the hex 0.36 km west</text>
<text x="297.64" y="154.69" font-size="10" fill="#3b2f23" font-family="Noto Serif, Liberation Serif, Georgia, serif" text-anchor="middle">Walk to roughly -17.82550, 31.04880 — about 0.36 km west of your anchor. Stay a few minutes and move</text>
<text x="297.64" y="168.69" font-size="10" fill="#3b2f23" font-family="Noto Serif, Liberation Serif, Georgia, serif" text-anchor="middle">around so the trace records a real visit, then bring the map home.</text>
