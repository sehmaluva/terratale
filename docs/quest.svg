<text x="528.93" y="41.35" font-size="9" fill="#3b2f23" font-family="Noto Serif, Liberation Serif, Georgia, serif" font-weight="bold" text-anchor="middle">N</text>
<text x="297.64" y="192.69" font-size="10.5" fill="#3b2f23" font-family="Noto Serif, Liberation Serif, Georgia, serif" text-anchor="middle">0.36 km at 270° from the anchor</text>
<text x="297.64" y="208.69" font-size="9.5" fill="#8d7a5f" font-family="Noto Serif, Liberation Serif, Georgia, serif" text-anchor="middle">that is roughly west</text>
<text x="297.64" y="375.18" font-size="8.5" fill="#8d7a5f" font-family="Noto Serif, Liberation Serif, Georgia, serif" text-anchor="middle">the map only grows where you actually stand</text>
